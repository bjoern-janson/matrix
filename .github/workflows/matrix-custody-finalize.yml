name: MATRIX custody consolidation final verification

on:
  push:
    branches:
      - chore/matrix-documentation-custody-consolidation
    paths:
      - .github/workflows/matrix-custody-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/matrix-documentation-custody-consolidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Apply current-state documentation patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text()
          old = '**Status:** conceptual kernel frozen; formalization, translation, and causal testing remain open.'
          new = '''**Status:** `MATRIX_0` kernel frozen; Attack 1 closed / assumption-scoped; A2-V0 complete; A2-V1 complete / scientific interpretation admitted; `MATRIX_1` not earned.

          ## Current program state

          The conceptual kernel below remains frozen. The repository has since completed its first formal attack and two finite causal assays without earning a kernel promotion:

          | Stage | Current standing |
          |---|---|
          | `MATRIX_0` conceptual kernel | **FROZEN** |
          | Attack 1 / `EXEC_V1` | **CLOSED / ASSUMPTION-SCOPED** |
          | A2-V0 | **COMPLETE**; post-execution structural analysis archived |
          | A2-V1 | **COMPLETE / SCIENTIFIC INTERPRETATION ADMITTED** |
          | `MATRIX_1` | **NOT EARNED** |

          Current navigation: [`formalization/EXEC_V1.md`](formalization/EXEC_V1.md), [`experiments/a2_v0/README.md`](experiments/a2_v0/README.md), [`experiments/a2_v1/README.md`](experiments/a2_v1/README.md), [`experiments/a2_v1/CURRENT_STATE.md`](experiments/a2_v1/CURRENT_STATE.md), and [`experiments/A2_V1_RESULT.md`](experiments/A2_V1_RESULT.md).

          This status block is navigational. It does not amend the frozen kernel, retroactively rewrite preregistrations, or promote post-execution findings into stronger claims.'''
          if old not in text:
              raise SystemExit('root README expected historical status line not found')
          if '## Current program state' in text:
              raise SystemExit('root README current-state block already present unexpectedly')
          root.write_text(text.replace(old, new, 1))

          result = Path('experiments/A2_V1_RESULT.md')
          rtext = result.read_text()
          marker = '## Repository-resident archival addendum'
          if marker in rtext:
              raise SystemExit('A2-V1 archival addendum already present unexpectedly')
          addendum = '''\n## Repository-resident archival addendum\n\nThis addendum records a **custody-only consolidation performed after the admitted result**. It does not alter the preregistration, execution, reported values, interpretation, or claim ceiling above.\n\nThe successful Actions artifact was originally retention-limited. Exact admitted execution bytes are now durably repository-resident under [`a2_v1/execution/`](a2_v1/execution/):\n\n- [`a2_v1/execution/artifacts/a2-v1-prospective-output.tar.gz`](a2_v1/execution/artifacts/a2-v1-prospective-output.tar.gz) is the exact sealed output tarball, SHA-256 `d1f7605ac4246cd872984a1a3efaead468a9cea242d5fd88642969af1344bfa7`;\n- [`a2_v1/result/primary.json.gz`](a2_v1/result/primary.json.gz) is deterministic compression of the exact 9,216-row primary map; decompression yields canonical SHA-256 `f1b0f55c0860e9847f69ef4a741f477a66dd5cc7f8d9ed4af35484066e223076`;\n- [`a2_v1/result/derived.json`](a2_v1/result/derived.json) preserves the exact preregistered membership/witness structures, SHA-256 `7b298eef81996ab804c09c5a4d8756d7fbd8842843bcef7a30b9de160f64e10b`;\n- [`a2_v1/execution/GITHUB_ACTIONS_WORKFLOW.yml`](a2_v1/execution/GITHUB_ACTIONS_WORKFLOW.yml) is an inert copy of the exact successful science workflow;\n- [`a2_v1/EXECUTION_CUSTODY.md`](a2_v1/EXECUTION_CUSTODY.md) records complete recovery/provenance details.\n\nThe original Actions artifact remains provenance, but it is no longer required for scientific-output availability. Historical validation-only records remain historical and are not rewritten into post-execution standing.\n'''
          result.write_text(rtext.rstrip() + '\n' + addendum)
          PY

      - name: Run frozen implementation test suite
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/a2_v1/implementation
          PYTHONPATH=. python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/a2-v1-tests.log
          grep -q 'Ran 30 tests' /tmp/a2-v1-tests.log
          grep -q '^OK$' /tmp/a2-v1-tests.log

      - name: Verify restored validation and scientific custody hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          9594e0107de2053fbcc971b16a806422f7a130dd6445e21717151fb72a07eb2e  experiments/a2_v1/implementation/evidence/FINAL_REVIEW.md
          a23d50d669022243d7809b838d3aa909b66739ebf9e07e4d9428bc7162132c20  experiments/a2_v1/implementation/evidence/IMPLEMENTATION_REPORT.md
          689ce1169fcadc5e0ebf19b9f2cf6f0de1c3315acd0d473aed3ed7abdb0f7475  experiments/a2_v1/implementation/evidence/INITIAL_REVIEW.md
          d6af584726ecb5ff08411573b97186a45b3843d78010eb6f2ae5f1a2be309557  experiments/a2_v1/implementation/evidence/controller_audit.py
          adb32579d31ce3d21146117df1d2e6582e1cabd6ae44ace722404af263e54d40  experiments/a2_v1/implementation/evidence/independent_references.zip
          dbefec748d7ea01a1e3e81090e0230ebe8ee3a964b069a91b7212f46f8d1e5c0  experiments/a2_v1/implementation/evidence/software_test_audit.json
          4aeb621b0375225dded426ce2fab58242ef9e29dc6b1b362fe3d8932eefec351  experiments/a2_v1/implementation/evidence/validation_call_audit.json
          ad0996b8fc0f01de502acd963626a35053516b3a3b95d4a2f98937109af51a8e  experiments/a2_v1/implementation/evidence/validation_receipt.json
          b397aba50af26e03946d18492c3580cc5acf5554fec347c3b22f72a907afc643  experiments/a2_v1/implementation/evidence/validation_run.zip
          d1f7605ac4246cd872984a1a3efaead468a9cea242d5fd88642969af1344bfa7  experiments/a2_v1/execution/artifacts/a2-v1-prospective-output.tar.gz
          a317bf081407694cefe2e84b97bfdbd845eef1077a7b92c6328785b565c6e8b3  experiments/a2_v1/result/primary.json.gz
          7b298eef81996ab804c09c5a4d8756d7fbd8842843bcef7a30b9de160f64e10b  experiments/a2_v1/result/derived.json
          EOF
          test "$(gzip -dc experiments/a2_v1/result/primary.json.gz | sha256sum | awk '{print $1}')" = 'f1b0f55c0860e9847f69ef4a741f477a66dd5cc7f8d9ed4af35484066e223076'
          test "$(git hash-object experiments/a2_v1/execution/GITHUB_ACTIONS_WORKFLOW.yml)" = '3c2527866e76f1fc251e4f56a0ff5e8c54994981'

      - name: Verify navigation and protected scientific paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'A2-V1 complete / scientific interpretation admitted' README.md
          grep -q 'COMPLETE / SCIENTIFIC INTERPRETATION ADMITTED' experiments/a2_v1/README.md
          grep -q 'MATRIX_1.*NOT EARNED' experiments/a2_v1/CURRENT_STATE.md
          ! grep -q 'No V1 assay code or scientific results are present' experiments/a2_v1/README.md
          git diff --exit-code 52023fe84c5c706c0b8b7c18d61936ec99070b65 -- \
            formalization/ \
            experiments/A2_PREREG_V0.md \
            experiments/A2_PREREG_V1.md \
            experiments/a2_v0/ \
            experiments/a2_v1/implementation/a2_v1/

      - name: Write durable consolidation verification record
        shell: bash
        run: |
          set -euo pipefail
          cat > experiments/a2_v1/CUSTODY_CONSOLIDATION_VERIFICATION.json <<EOF
          {
            "schema": "matrix-custody-consolidation-verification/1",
            "base_commit": "52023fe84c5c706c0b8b7c18d61936ec99070b65",
            "workflow_input_commit": "${GITHUB_SHA}",
            "software_tests_passed": 30,
            "restored_validation_hashes": "PASS",
            "scientific_archive_hashes": "PASS",
            "canonical_primary_sha256": "f1b0f55c0860e9847f69ef4a741f477a66dd5cc7f8d9ed4af35484066e223076",
            "derived_sha256": "7b298eef81996ab804c09c5a4d8756d7fbd8842843bcef7a30b9de160f64e10b",
            "sealed_output_tarball_sha256": "d1f7605ac4246cd872984a1a3efaead468a9cea242d5fd88642969af1344bfa7",
            "protected_scientific_paths_unchanged": true,
            "scientific_rerun_performed": false,
            "scientific_interpretation_changed": false,
            "status": "PASS"
          }
          EOF

      - name: Remove temporary live cleanup workflows and commit final branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/matrix-custody-consolidation.yml \
            .github/workflows/matrix-custody-restore-audit.yml \
            .github/workflows/matrix-custody-finalize.yml
          git config user.name 'bjarki'
          git config user.email 'bjoernjanson.de@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize MATRIX documentation and custody consolidation'
          git push origin HEAD:chore/matrix-documentation-custody-consolidation
