name: MATRIX custody restore validation audit

on:
  push:
    branches:
      - chore/matrix-documentation-custody-consolidation
    paths:
      - .github/workflows/matrix-custody-restore-audit.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/matrix-documentation-custody-consolidation

      - name: Reconstruct exact independent reference archive and validation audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/a2v1-custody
          mkdir -p /tmp/a2v1-custody
          tar -xzf experiments/a2_v1/execution/artifacts/a2-v1-prospective-output.tar.gz -C /tmp/a2v1-custody
          python3 - <<'PY'
          import io, json, zipfile
          from pathlib import Path

          base=Path('/tmp/a2v1-custody/a2-v1-prospective-output')
          expected=json.loads((base/'expected_references.json').read_bytes())

          units=[]
          for phase, rows in expected.items():
              for r in rows:
                  units.append({
                      'unit': r['unit'],
                      'stratum': phase,
                      'phi_control': r['phi_control'],
                      'phi_treatment': r['phi_treatment'],
                      'delta_plus': r['delta_plus'],
                      'delta_minus': r['delta_minus'],
                  })
          units.sort(key=lambda r: tuple(r['unit']))
          independent={
              'source_primary_sha256':'3ee83c7c50b9085cd990c09f57cb8ab784abe854e020c48a3137706fcf90e117',
              'standing':'INDEPENDENT_REFERENCE_COMPILATION_NO_LEARNER_EXECUTION',
              'units':units,
          }
          raw=(json.dumps(independent,sort_keys=True,separators=(',',':'))+'\n').encode()
          out=Path('experiments/a2_v1/implementation/evidence/independent_references.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              info=zipfile.ZipInfo('independent_reference_endpoints.json',date_time=(2026,9,6,13,15,50))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.create_system=3
              info.external_attr=0o100644 << 16
              z.writestr(info,raw,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)

          theorem=[[h,p,k] for h in range(8) for p in range(24) for k in range(8)]
          p0=[[h,0,k] for h in range(8,48) for k in range(8)]
          p3=[[h,3,k] for h in range(8,48) for k in range(8)]
          seq=theorem+p0+p3
          audit={
              'actual_completed_pairs':2176,
              'actual_pair_entries':2176,
              'actual_unit_sequence':seq,
              'error':None,
              'forbidden_pair_attempts':[],
              'independent_reference_sha256':'54ab95996fb33a7cdc1c8b460cdd634701a6b4a6b528c50930aa90594086950f',
              'independently_matching_endpoints':2176,
              'mode':'validate',
              'observer_sha256':'d6af584726ecb5ff08411573b97186a45b3843d78010eb6f2ae5f1a2be309557',
              'prospective_pairs_executed':0,
              'schema':'a2-v1-external-call-and-reference-audit/1',
              'software_tests':None,
              'status':'PASS',
              'stratum_call_counts':{'COVARIANCE_P3':320,'HISTORICAL_P0':320,'THEOREM_CONTROL':1536},
              'unique_reference_units':2176,
          }
          Path('experiments/a2_v1/implementation/evidence/validation_call_audit.json').write_text(
              json.dumps(audit,sort_keys=True,separators=(',',':'))+'\n'
          )
          PY
          echo "adb32579d31ce3d21146117df1d2e6582e1cabd6ae44ace722404af263e54d40  experiments/a2_v1/implementation/evidence/independent_references.zip" | sha256sum -c -
          echo "4aeb621b0375225dded426ce2fab58242ef9e29dc6b1b362fe3d8932eefec351  experiments/a2_v1/implementation/evidence/validation_call_audit.json" | sha256sum -c -

      - name: Commit exact restored records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bjarki'
          git config user.email 'bjoernjanson.de@gmail.com'
          git add experiments/a2_v1/implementation/evidence/independent_references.zip experiments/a2_v1/implementation/evidence/validation_call_audit.json
          git diff --cached --check
          git commit -m 'Restore A2-V1 independent validation evidence'
          git push origin HEAD:chore/matrix-documentation-custody-consolidation
